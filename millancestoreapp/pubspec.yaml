name: millancestoreapp
description: MILLANCE Store — E-Commerce Shopping App (Flipkart-style)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  provider: ^6.1.2

  # HTTP
  dio: ^5.4.3+1

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # UI & Animations
  animate_do: ^3.3.4
  shimmer: ^3.0.0
  lottie: ^3.1.0
  fl_chart: ^0.67.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^5.0.0

  # QR Code
  qr_flutter: ^4.1.0

  # Utils
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  image_picker: ^1.0.7

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/logo/
    - assets/banners/
    - assets/categories/
    - assets/products/

  # Fonts loaded via google_fonts package at runtime

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#ff7a00"
  adaptive_icon_foreground: "assets/images/logo.jpeg"
